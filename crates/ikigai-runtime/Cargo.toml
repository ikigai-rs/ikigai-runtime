[package]
name = "ikigai-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The engine-neutral, wasm-clean core of the ikigai runtime: budget/capability plumbing, the grant-to-WASI plan, the CoreEngine trait, the ikigai-module ABI v1 session types, the WIT projection types, and the content-addressed loader/compiled-cache model."
keywords = ["ikigai", "roc", "webassembly", "wasm", "capability"]
categories = ["wasm", "api-bindings"]

[dependencies]
ikigai-core = { workspace = true }
# The session's wire types (R-D6 as amended): re-exported from `session`, with the ABI's
# `u64` packing and export names beside them. `no_std + alloc`, so this stays wasm-clean.
ikigai-module-abi = { workspace = true }
blake3 = { workspace = true }
